<div class="min-h-screen bg-[#EEF2F1]">
  <div class="max-w-3xl mx-auto px-6 py-10 space-y-5">

    <!-- Card -->
    <div class="bg-white rounded-sm px-8 py-8">
      <p class="text-[17px] text-gray-700 mb-7">
        Account details
      </p>

      <div class="space-y-6">

        <!-- Row -->
        <div class="grid grid-cols-12 items-center gap-4">
          <label class="col-span-4 text-[15px] font-medium text-gray-900">
            Account holder's name
          </label>
          <input
            class="col-span-8 border-b border-gray-200 focus:border-gray-500 focus:outline-none py-1.5 text-gray-700"
            placeholder="e.g. John Doe" />
        </div>

        <!-- Row -->
        <div class="grid grid-cols-12 items-center gap-4">
          <label class="col-span-4 text-[15px] font-medium text-gray-900">
            Account No.
          </label>
          <input
            class="col-span-8 border-b border-gray-200 focus:border-gray-500 focus:outline-none py-1.5 text-gray-700"
            placeholder="e.g. 3020041011" />
        </div>

        <!-- Row -->
        <div class="grid grid-cols-12 items-center gap-4">
          <label class="col-span-4 text-[15px] font-medium text-gray-900">
            Routing No.
          </label>
          <div class="col-span-8 relative">
            <input
              class="w-full border-b border-gray-200 focus:border-gray-500 focus:outline-none py-1.5 pr-8 text-gray-700"
              placeholder="e.g. 110000000" />
            <span class="absolute right-0 top-2 text-gray-700 text-sm">
              <svg (click)="openModalBank()" fill="none" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
                <path fill="currentColor" fill-rule="evenodd"
                  d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8 4a.75.75 0 0 1-.75-.75v-3.5a.75.75 0 0 1 1.5 0v3.5A.75.75 0 0 1 8 12M8 1.5c3.584 0 6.5 2.916 6.5 6.5s-2.916 6.5-6.5 6.5A6.51 6.51 0 0 1 1.5 8c0-3.584 2.916-6.5 6.5-6.5M7 5a1 1 0 1 1 2 0 1 1 0 1 1-2 0"
                  clip-rule="evenodd"></path>
              </svg>
            </span>
          </div>
        </div>

        <!-- Row -->
        <div class="grid grid-cols-12 items-center gap-4">
          <label class="col-span-4 text-[15px] font-medium text-gray-900">
            Account type
          </label>
          <select
            class="col-span-8 border-none border-gray-200 focus:border-gray-500 focus:outline-none py-1.5 text-gray-700 bg-transparent">
            <option class=" border-b border-gray-500">Checking</option>
          </select>
        </div>

      </div>
    </div>

    <!-- Billing -->
   <div class="bg-white rounded-sm px-8 py-6 flex justify-between items-center">
  <div class="w-full">
    <p class="text-[17px] text-gray-700">
      Billing address
    </p>

    <div class="flex items-center justify-between w-full mt-7">
      <p class="text-sm text-gray-700 font-medium">
        Add address
      </p>

      <img src="arrow.svg" alt="" class="h-8 w-8 text-gray-400" />
    </div>
  </div>
</div>


    <!-- Footer -->
    <div class="flex justify-between items-center">
      <p class="text-[16px] text-gray-500 max-w-4xl">
        We never share your personal details with anyone other than our payment provider for your withdrawals, or unless
        we're legally obligated to do so.
      </p>

      <button class="bg-[#006D6F] text-white px-7 py-2 rounded-sm text-sm">
        Save
      </button>
    </div>

  </div>
</div>
<app-bank-detail-modal></app-bank-detail-modal>
