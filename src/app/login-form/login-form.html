<div class="min-h-[80vh] flex items-center justify-center bg-white px-4">
  <div class="w-full max-w-92.5 bg-white border border-gray-200 rounded-xl px-4 py-4">

    <!-- Heading -->
    <h2 class="text-2xl font-semibold text-center text-gray-900 mb-8">
      Log in
    </h2>

    <!-- Email -->
    <div class="mb-6">
      <input
        type="text" name="email" [(ngModel)]="email" placeholder=" Username or email"
        class="px-0 mt-4 text-gray-600 w-full bg-transparent border-0 outline-none ring-0"/>
      <div class="h-px bg-gray-200 mt-1"></div>
    </div>

    <!-- Password -->
    <div class="mb-6 relative">
      <input
       [type]="showPassword ? 'text' : 'password'" name="password" [(ngModel)]="password" placeholder="Password"
        class="px-0 mt-4 text-gray-600 w-full bg-transparent border-0 outline-none ring-0"/>
      <div class="h-px bg-gray-200"></div>

      <!-- Eye icon (UI only) -->
      <button   (click)="togglePassword()"
        type="button"
        class="absolute right-0 top-9 text-gray-500 hover:text-gray-700"
      >
        <svg fill="none" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M14.53 2.53a.75.75 0 0 0-1.06-1.06l-2.163 2.162A8.9 8.9 0 0 0 8 3C4.15 3 1.513 5.398.276 7.143a1.47 1.47 0 0 0 0 1.714 10.4 10.4 0 0 0 3.004 2.802l-1.81 1.81a.75.75 0 1 0 1.06 1.061zM4.386 10.553a8.8 8.8 0 0 1-2.838-2.552V8s0-.003.003-.007C2.632 6.467 4.857 4.5 8 4.5c.764 0 1.473.116 2.126.314L8.788 6.15A2.1 2.1 0 0 0 8 6c-1.14 0-2.063.895-2.063 2 0 .293.065.57.181.821zm2.928 1.194a.87.87 0 0 1 .625-.247H8c3.143 0 5.367-1.967 6.449-3.492q.004-.006.003-.007V8s0-.003-.003-.007a8.7 8.7 0 0 0-1.014-1.181c-.321-.314-.351-.834-.034-1.151a.717.717 0 0 1 1-.031 10.3 10.3 0 0 1 1.323 1.514 1.47 1.47 0 0 1 0 1.714C14.487 10.602 11.85 13 8 13q-.127 0-.25-.003c-.653-.018-.898-.789-.436-1.25"></path></svg>
      </button>
    </div>

    <!-- Button -->
    <button
      type="button"
      (click)="onLogin()"
      class="mt-3 w-full bg-[#007782] hover:bg-teal-800 text-white font-medium py-3 rounded-lg transition"
    >
      Continue
    </button>

    <!-- Error -->
    <p *ngIf="error" class="text-red-500 text-sm mt-3 text-center">
      {{ error }}
    </p>

    <!-- Links -->
    <div class="text-center mt-6 space-y-4">
      <a href="#" class="block text-teal-700 hover:underline">
        Forgot your password?
      </a>
      <a href="#" class="block text-teal-700 hover:underline">
        Having trouble?
      </a>
    </div>

  </div>
</div>
