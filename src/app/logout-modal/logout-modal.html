@if (isModalOpen) {
<div class="fixed inset-0 bg-black/40 flex items-center justify-center px-4 z-50">
  <div class="w-full max-w-sm bg-white rounded-xl p-6 sm:p-7">

    <!-- Title -->
    <h2 class="text-xl font-semibold text-gray-900 text-center">
      Logged out
    </h2>

    <!-- Description -->
    <p class="text-sm text-gray-600 text-left mt-3 leading-relaxed">
      You've logged out of a session, using Safari,
      iPhone in Bahawalpur, Pakistan.
    </p>

    <p class="text-sm text-gray-600 text-left mt-4 leading-relaxed">
      If you didn’t recognize this session, change your
      password now to protect your account.
    </p>

    <!-- Actions -->
    <div class="mt-6 space-y-3">
      <button
        class="w-full bg-[#006D6F] hover:bg-[#006D6F]
               text-white font-semibold py-3 rounded-lg
               transition"
      >
        Change password
      </button>

      <button (click)="closelogout()"
        class="w-full border border-teal-700
               text-teal-700 font-semibold py-3 rounded-lg
               hover:bg-teal-50 transition"
      >
        Done
      </button>
    </div>

  </div>
</div>
}
