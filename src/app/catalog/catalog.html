<div *ngIf="isModalOpen" class="fixed inset-0 bg-black/30 flex justify-start p-4 z-50"
(click)="isModalOpen = false">

<div class="max-w-4xl mx-auto px-4 py-6 bg-white rounded-md h-[72%] relative sm:right-60 sm:top-10"
(click)="$event.stopPropagation()">
 
  <h2 class="text-sm text-gray-500 mb-4">Your searches</h2>

  <!-- Item -->
  <div
    *ngFor="let item of searches"
    class="flex items-start justify-between gap-4 py-4"
  >
    <!-- Left content -->
    <div class="flex-1">
      <p class="text-sm font-semibold text-black">
        <span class="text-teal-600 font-bold">+{{ item.count }}</span>
        {{ item.title }}
      </p>

      <p class="text-sm text-gray-500 mt-1 leading-relaxed">
        {{ item.description }}
      </p>
    </div>

    <!-- Bookmark icon -->
    <button class="shrink-0 mt-1">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-5 w-5 text-gray-400"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="1.5"
          d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-4-7 4V5z"
        />
      </svg>
    </button>
  </div>
</div>
</div>
