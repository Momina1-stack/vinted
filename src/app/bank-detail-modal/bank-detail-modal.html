 <div *ngIf="isModalOpen" class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4">
      <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm  overflow-hidden max-h-[75vh] flex flex-col">
        
        <!-- Header -->
        <div class="bg-white px-4 py-2 sm:px-6 sm:py-6 md:px-8 md:py-5 shrink-0">
          <h1 class="text-xl sm:text-2xl md:text-3xl font-medium text-gray-900 text-center">
            Routing number
          </h1>
        </div>

        <!-- Scrollable Content -->
        <div class="px-4 sm:px-6 md:px-8 pb-4 overflow-y-auto flex-1">
          <!-- Check Image -->
          <div class="rounded-lg overflow-hidden shadow-lg bg-gray-100">
            <img 
              src="paymentAlertGraphicBankAccountUS.jpg" 
              alt="Routing number check example"
              class="w-full h-auto object-contain">
          </div>

          <!-- Description Text -->
          <p class="text-gray-700  sm:text-left! text-sm sm:text-base md:text-md mt-3 sm:mt-6 text-center leading-relaxed">
            Look at the image above explaining where to find your routing number
          </p>
        </div>

        <!-- Close Button -->
        <div class="px-4 sm:px-6 md:px-8 pb-4 sm:pb-6 md:pb-8 shrink-0">
          <button 
            (click)="closeModal()"
            class="w-full bg-teal-600 hover:bg-teal-700 active:bg-teal-800 text-white font-semibold text-sm sm:text-base md:text-lg py-2 sm:py-2 px-4 sm:px-6 rounded-lg transition-all duration-200 shadow-md hover:shadow-lg">
            OK, close
          </button>
        </div>
      </div>
    </div>
