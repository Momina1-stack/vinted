<div class="flex flex-col md:flex-row min-h-screen p-4 md:p-8">
  <!-- Sidebar -->
  <aside class="w-full md:w-64 bg-white px-6 mb-6 md:mb-0">
    <h2 class="text-xl font-medium mb-6">Settings</h2>
    <ul class="space-y-6">
      <li class="text-gray-700 font-medium hover:text-teal-600 cursor-pointer">Profile details</li>
      <li class="text-gray-600 hover:text-teal-600 cursor-pointer">Account settings</li>
      <li class="text-gray-600 hover:text-teal-600 cursor-pointer">Shipping</li>
      <li class="text-gray-600 hover:text-teal-600 cursor-pointer">Payments</li>
      <li class="text-gray-600 hover:text-teal-600 cursor-pointer">Bundle discounts</li>
      <li class="text-gray-600 hover:text-teal-600 cursor-pointer">Notifications</li>
      <li class="text-gray-600 hover:text-teal-600 cursor-pointer">Privacy settings</li>
      <li class="text-gray-600 hover:text-teal-600 cursor-pointer">Security</li>
    </ul>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 h-[50%] bg-white rounded-lg shadow mx-20 md:ml-6">
    <!-- Your photo -->
    <div class="flex items-center justify-between border-b border-gray-200 p-6 pb-4 mb-4">
      <div>
        <p class="font-medium text-gray-700">Your photo</p>
      </div>
      <div class="flex items-center gap-4">
        <div class="w-12 h-12 border rounded-full object-cover"></div>
        <button class="px-4 py-2 border border-teal-600 text-teal-600 rounded hover:bg-teal-50 transition">Choose
          photo</button>
      </div>
    </div>

    <!-- Username -->
    <div class="flex items-center justify-between border-b p-6 border-gray-200 pb-4 mb-4">
      <div>
        <p class="font-medium text-gray-700">Username</p>
      </div>
      <div>
        <button class="px-4 py-2 border border-teal-600 text-teal-600 rounded hover:bg-teal-50 transition">Change
          username</button>
      </div>
    </div>

    <!-- About you -->
    <div
      class="flex flex-col md:flex-row justify-between items-start p-6 md:items-center border-b border-gray-200 pb-4">
      <div>
        <p class="font-medium text-nowrap text-gray-700">About you</p>
      </div>
      <textarea placeholder="Tell us more about yourself and your style"
        class="text-[13px] text-gray-500 text-right! mt-2 md:mt-0 md:w-1/3 p-2 border border-transparent rounded focus:outline-none focus:ring-2 focus:ring-teal-500"
        rows="3"></textarea>
    </div>
    <!-- 2nd sec -->
     <div class="max-w-4xl ml-30 mt-10 w-full mx-auto p-6 bg-white rounded-lg shadow-md space-y-6">

  <!-- Location Section -->
  <div class="space-y-4">
    <h3 class="text-gray-700 font-medium">My location</h3>

    <!-- Country -->
    <div class="flex justify-between items-center border-b border-gray-300 pb-3">
      <span class="text-gray-600">Country</span>
      <select
        class="text-gray-900 bg-transparent focus:outline-none"
        [(ngModel)]="country">
        <option *ngFor="let c of countries" [value]="c">{{c}}</option>
      </select>
    </div>

    <!-- Town/City -->
    <div class="flex justify-between items-center border-b border-gray-300 pb-3">
      <span class="text-gray-600">Town/City</span>
      <select
        class="text-gray-400 bg-transparent focus:outline-none"
        [(ngModel)]="city">
        <option value="" disabled>Select a city</option>
        <option *ngFor="let city of cities[country]" [value]="city">{{city}}</option>
      </select>
    </div>

    <!-- Show city toggle -->
    <div class="flex justify-between items-center pt-2">
      <span class="text-gray-600">Show city in profile</span>
      <label class="relative inline-flex items-center cursor-pointer">
        <input type="checkbox" [(ngModel)]="showCity" class="sr-only peer">
        <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-2 peer-focus:ring-teal-500 rounded-full peer peer-checked:bg-teal-600 transition-all"></div>
        <div class="absolute left-1 top-1 w-4 h-4 bg-white rounded-full shadow-md peer-checked:translate-x-5 transition-all"></div>
      </label>
    </div>
  </div>

  <!-- Language Section -->
  <div class="border-b border-gray-300 pb-3">
    <span class="text-gray-600">Language</span>
    <select
      class="w-full mt-1 text-gray-900 bg-transparent focus:outline-none"
      [(ngModel)]="language">
      <option *ngFor="let lang of languages" [value]="lang">{{lang}}</option>
    </select>
  </div>

  <!-- Update button -->
  <div class="pt-4">
    <button class="w-full bg-teal-700 hover:bg-teal-800 text-white py-2 px-4 rounded-md transition">
      Update profile
    </button>
  </div>

</div>
  </main>
  
</div>
