<div class="min-h-screen bg-white flex items-start justify-center px-4 sm:px-6">
  <div class="w-full max-w-xs text-center mt-20">

    <!-- Heading -->
    <h2 class="text-2xl font-semibold text-gray-900 mb-4">
      Confirm change
    </h2>

    <!-- Description -->
    <p class="text-gray-600 text-base leading-relaxed mb-10">
      You need to confirm
      <span class="font-medium text-gray-800">{{ email }}</span>
      is your email address before you can update it.
    </p>

    <!-- Button -->
    <button
      class="w-full bg-[#007782] hover:bg-[#007782] text-white font-medium py-3 rounded-lg transition-all mb-6">
      Send confirmation email
    </button>

    <!-- Link -->
    <button
      class="text-[#007782] hover:underline text-sm font-medium">
      I don't have access to this email
    </button>

  </div>
</div>
