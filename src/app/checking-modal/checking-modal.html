 @if (isModalOpen) {
 <div  class="fixed inset-0 bg-black/30 flex items-center justify-center p-4 z-50 md:hidden ">
 <div class=" bg-white px-4 py-6 ">
      <div class=" max-w-sm">
        <!-- Header -->
        <div class="flex items-center justify-between mb-8">
          <h1 class="text-2xl font-normal text-gray-900">Account type</h1>
          <button 
            type="button"
            class="text-teal-700 hover:text-teal-800"
            (click)="closeChecking()"
          >
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>

        <!-- Account Options -->
        <div class="space-y-0 mb-8">
          <!-- Checking Option -->
          <div 
            class="border-b border-gray-200 py-6 cursor-pointer hover:bg-gray-50 transition-colors"
            (click)="selectAccountType('checking')"
          >
            <div class="flex items-start justify-between">
              <div class="flex-1 pr-4">
                <h2 class="text-lg font-normal text-gray-900 mb-1">Checking</h2>
                <p class="text-base text-gray-500 leading-relaxed">
                  The account you use for everyday spending
                </p>
              </div>
              <div class="shrink-0 pt-1">
                <div class="relative w-6 h-6">
                  <div 
                    [class]="selectedAccount === 'checking' 
                      ? 'w-6 h-6 rounded-full border-2 border-teal-700 bg-teal-700 flex items-center justify-center' 
                      : 'w-6 h-6 rounded-full border-2 border-gray-300'"
                  >
                    <div 
                      *ngIf="selectedAccount === 'checking'"
                      class="w-2.5 h-2.5 rounded-full bg-white"
                    ></div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Savings Option -->
          <div 
            class="border-b border-gray-200 py-6 cursor-pointer hover:bg-gray-50 transition-colors"
            (click)="selectAccountType('savings')"
          >
            <div class="flex items-start justify-between">
              <div class="flex-1 pr-4">
                <h2 class="text-lg font-normal text-gray-900 mb-1">Savings</h2>
                <p class="text-base text-gray-500 leading-relaxed">
                  Your account for savings and longer-term financial goals
                </p>
              </div>
              <div class="shrink-0 pt-1">
                <div class="relative w-6 h-6">
                  <div 
                    [class]="selectedAccount === 'savings' 
                      ? 'w-6 h-6 rounded-full border-2 border-teal-700 bg-teal-700 flex items-center justify-center' 
                      : 'w-6 h-6 rounded-full border-2 border-gray-300'"
                  >
                  @if (selectedAccount === 'savings') {
                    <div 
                     
                      class="w-2.5 h-2.5 rounded-full bg-white"
                    ></div>}
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Save Button -->
        <div>
          <button
            type="button"
            class="w-full bg-teal-700 hover:bg-teal-800 text-white font-medium py-4 px-6 rounded-lg transition-colors text-base"
          >
            Save
          </button>
        </div>
      </div>
    </div>
 </div>
}
