<div class="min-h-screen bg-white px-4 sm:px-6 lg:px-0">
  <div class="max-w-7xl mx-auto py-8 pl-0 md:pl-24 lg:pl-32">

    <!-- Heading -->
    <h2 class="text-xl  text-gray-800 mb-6">
      Change username
    </h2>

    <!-- Info Box -->
    <div class="flex items-start gap-3 bg-[#EEF5F4] text-gray-700 rounded-lg p-4 mb-10 max-w-7xl">
      <div class="flex items-center justify-center w-6 h-6 rounded-full text-[#007782] bg-white">
         <svg aria-hidden="true" fill="currentcolor" viewBox="0 0 24 24" width="24" height="24">
        <path fill="" fill-rule="evenodd"
          d="M2 11.996C2 6.476 6.475 2 11.996 2c5.52 0 9.996 4.476 9.996 9.996 0 5.52-4.476 9.995-9.996 9.995C6.475 21.991 2 17.516 2 11.996ZM10.74 7a1.25 1.25 0 1 1 2.5 0 1.25 1.25 0 0 1-2.5 0Zm.25 3v8h2v-8h-2Z"
          clip-rule="evenodd"></path>
      </svg>
      </div>
      <p class="text-sm leading-relaxed">
        If you change your username, you won’t be able to modify it again for 30 days.
      </p>
    </div>

    <!-- Username Row -->
    <div class="flex flex-col md:flex-row md:items-start md:justify-between gap-6 max-w-4xl">

      <!-- Label (LEFT) -->
      <label class="text-sm font-medium text-gray-800 md:w-1/4 pt-2">
        Username
      </label>

      <!-- Right Side (Input + Button) -->
      <div class="w-full md:w-3/4">

        <!-- Input -->
        <input type="text" [(ngModel)]="username" class="w-full
         border-0 border-b border-gray-300
         focus:border-b-teal-600 focus:outline-none
         py-2 text-gray-800 text-base mb-6" />



      </div>
    </div>

    <!-- Button -->
    <div class="flex justify-end">
      <button class="cursor-pointer bg-[#8FC2C0] hover:bg-[#7BB6B3] text-white font-medium px-5 py-2 rounded-lg transition-all">
        Change username
      </button>
    </div>


  </div>
</div>
