<header class="bg-white border-b border-gray-200 lg:pr-14 lg:pl-8 ">
  <!-- <button *ngIf="!authService.isLoggedIn">
    Login
  </button>
  <div *ngIf="authService.isLoggedIn">
    <span>Welcome Admin</span>
    <button (click)="logout()">Logout</button>
  </div> -->

  <div class="max-w-7xl mx-auto px-4">

    <!-- ================= TOP BAR ================= -->
    <div class="flex items-center justify-between h-14 border-b border-gray-200">

      <!-- Logo -->
      <div class="flex items-center">
        <img src="logo.f29f72cb.svg" alt="Vinted" class="h-10">
      </div>

      <!-- ================= DESKTOP SEARCH ================= -->
      <div class="hidden lg:flex flex-1 max-w-3xl mx-2">
        <div class="flex items-center bg-gray-100 rounded-md w-full h-9">

          <!-- Catalog -->
          <div class="relative">
            <button (click)="toggleCatalog()"
              class="flex items-center gap-2 px-3 h-9 border-r border-gray-300 hover:bg-gray-200">
              <span class="text-sm text-[#5A6566] font-medium">Catalog</span>
              <svg viewBox="0 0 16 16" width="16" height="16" class="fill-[#5A6566]">
                <path d="M8 12 2 6h12z"></path>
              </svg>
            </button>

            <div *ngIf="isCatalogOpen" class="absolute left-0 mt-2 w-36 rounded-md border bg-white shadow-lg z-50">
              <button class="block w-full px-4 py-2 text-left hover:bg-gray-100">
                Catalog
              </button>
              <button class="block w-full px-4 py-2 text-left hover:bg-gray-100">
                Member
              </button>
            </div>
          </div>

          <!-- Search -->
          <div class="relative flex-1">
            <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-[#7A8384]" fill="none"
              stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>

            <input type="text" placeholder="Search for items"
              class="border-none w-full pl-10 pr-10 h-9 bg-[#EDF2F2] rounded-r-md focus:outline-none">

            <button class="absolute right-1 top-6 -translate-y-1/2" (click)="openModal()">
              <svg class="w-6 h-6 text-[#007782]" fill="none" stroke="" viewBox="0 0 24 24">
                <path fill="currentColor"
                  d="M8.75 1.004a.75.75 0 0 1 0 1.5H7.07a1.25 1.25 0 0 0-1.04.557c-.255.383-.494.943-1.03.943H2.75c-.69 0-1.25.56-1.25 1.25v7c0 .69.56 1.25 1.25 1.25h10.5c.69 0 1.25-.56 1.25-1.25v-5.5a.75.75 0 0 1 1.5 0v5.5a2.75 2.75 0 0 1-2.75 2.75H2.75A2.75 2.75 0 0 1 0 12.254v-7a2.75 2.75 0 0 1 2.75-2.75h1.849l.183-.275A2.75 2.75 0 0 1 7.07 1.004zm-.749 4a3.5 3.5 0 1 1 0 7 3.5 3.5 0 0 1 0-7m0 1.5a2 2 0 1 0 0 4 2 2 0 0 0 0-4m5.012-6c.15 0 .312.088.375.263l.2.537c.187.512.587.912 1.1 1.112l.55.213a.4.4 0 0 1 0 .75l-.55.213c-.513.2-.913.6-1.1 1.112l-.2.537a.4.4 0 0 1-.388.263.4.4 0 0 1-.388-.263l-.2-.537a1.9 1.9 0 0 0-1.1-1.112l-.55-.213a.4.4 0 0 1 0-.75l.55-.213c.513-.2.913-.6 1.1-1.112l.2-.537a.43.43 0 0 1 .4-.263Z">
                </path>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <!-- ================= DESKTOP ACTIONS ================= -->
      <div class="hidden lg:flex items-center gap-3">

        <!-- Sign up / Login -->
        <div  *ngIf="!auth.isLoggedIn" class="flex border border-[#007782] rounded-md overflow-hidden" routerLink="/login">
          <button class="px-3 py-1.5 text-xs text-[#007782] hover:bg-teal-50">
            Sign up
          </button>
          <div class="w-px bg-[#007782]"></div>
          <button class="px-3 py-1.5 text-xs text-[#007782] hover:bg-teal-50">
            Log in
          </button>
        </div>

        <!-- login -->
        <div  *ngIf="auth.isLoggedIn" class="flex gap-3 text-gray-400!">
          <div><a routerLink="/inbox">
              <span class="web_ui__Button__content"><span style="width:24px">
                  <svg fill="none" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
                    <path fill="currentColor"
                      d="M.998 7.021a3 3 0 0 1 3-3H20a3 3 0 0 1 3 3V17a3 3 0 0 1-3 3H3.998a3 3 0 0 1-3-3V7.02Zm18.96-1.5H4.024l6.86 5.62a1.75 1.75 0 0 0 2.218 0zM2.66 6.343a1.5 1.5 0 0 0-.162.678V17a1.5 1.5 0 0 0 1.5 1.5H20a1.5 1.5 0 0 0 1.5-1.5V7.02c0-.247-.06-.481-.167-.687l-7.28 5.967a3.25 3.25 0 0 1-4.12 0z">
                    </path>
                  </svg></span></span></a>
          </div>
          <div class="relative text-gray-400!">
            <div><a >
                <span style="width:24px"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
                    <path fill="currentColor"
                      d="M4.5 17.5c0-2.08 1.71-3.18 1.77-3.21l.73-.44V9a5.5 5.5 0 0 1 11 0v4l.01.84.7.44a4.01 4.01 0 0 1 1.79 3.22zm8 3a2.5 2.5 0 0 1-2.29-1.5h4.58a2.5 2.5 0 0 1-2.29 1.5m7-7.5V9a7 7 0 1 0-14 0v4S3 14.5 3 17.5c0 .83.67 1.5 1.5 1.5h4.14a4 4 0 0 0 7.72 0h4.14c.83 0 1.5-.67 1.5-1.5 0-3-2.5-4.5-2.5-4.5">
                    </path>
                  </svg></span>
                </a>
             </div>
          </div>
          <div class="relative text-gray-400"><a routerLink="/favlist" aria-label="Favorites">
              <svg fill="none" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
                <path fill="currentColor"
                  d="M3.365 6.274C4.39 4.839 6.017 4.189 7.758 4.639c1.481.383 2.865 1.54 3.555 2.882.277.54 1.095.54 1.372 0 .69-1.342 2.074-2.5 3.556-2.882 1.741-.45 3.368.2 4.394 1.634 2.04 2.854.085 6.26-2.247 8.334l-.002.001-5.558 4.578c-.478.42-1.198.42-1.676-.001l-5.538-4.577-.001-.001c-2.333-2.074-4.288-5.48-2.248-8.333m8.634-.474C11.05 4.567 9.66 3.58 8.14 3.188c-2.343-.605-4.627.281-6.012 2.22-2.511 3.514-.45 7.717 2.474 10.316l.002.002 5.54 4.58a2.8 2.8 0 0 0 3.69.002l5.56-4.581.004-.003c2.924-2.599 4.985-6.803 2.474-10.316-1.386-1.94-3.67-2.825-6.014-2.22-1.518.393-2.91 1.38-3.859 2.612">
                </path>
              </svg></a>
          </div>
          <div class="relative">
            <!-- toggle -->
            <input type="checkbox" id="profileToggle" class="peer hidden" />

            <!-- profile + arrow -->
            <label for="profileToggle" class="flex items-center gap-1 cursor-pointer">
              <div class="bg-gray-400 w-6 h-6 rounded-full object-cover" alt="profile"></div>
              <svg viewBox="0 0 20 20" class="w-4 h-4 text-gray-400 transition-transform peer-checked:rotate-180"
                fill="currentColor">
                <path d="M5.25 7.5L10 12.25L14.75 7.5" fill-rule="evenodd" clip-rule="evenodd" />
              </svg>
            </label>

            <!-- dropdown -->
            <div class="z-40 absolute right-0 mt-4 w-48 bg-white text-gray-500 shadow-lg 
           opacity-0 scale-95 pointer-events-none
           peer-checked:opacity-100 peer-checked:scale-100 peer-checked:pointer-events-auto
           transition-all duration-200">
              <ul class="py-1 text-sm text-gray-700">
                <li class="px-4 py-1 hover:bg-gray-100 cursor-pointer">Profile</li>
                <li class="px-4 py-2 hover:bg-gray-100 cursor-pointer">Invite Friends</li>
                <li class="px-4 py-2 hover:bg-gray-100 cursor-pointer">Settings</li>
                 <li class="px-4 py-2 hover:bg-gray-100 cursor-pointer">Personalization</li>
                <li class="px-4 py-2 hover:bg-gray-100 cursor-pointer">Wallet</li>
                <li class="px-4 py-2 hover:bg-gray-100 cursor-pointer">My orders</li>
                 <li class="px-4 py-2 hover:bg-gray-100 cursor-pointer">Donations</li>
                <li (click)="logout()"  class="px-4 py-2 hover:bg-gray-100 cursor-pointer">Logout</li>
              </ul>
            </div>
          </div>




        </div>




        <!-- Sell -->
        <button routerLink="/login" class="px-4 py-1.5 bg-[#007782] text-white text-xs rounded-md">
          Sell now
        </button>

        <!-- Help -->
        <button class="w-7 h-7 border rounded-full text-[#5A6566]">?</button>

        <!-- Language -->
        <div class="relative">
          <button (click)="toggleLanguage()" class="flex items-center gap-1 px-2 py-1">
            <span class="text-sm text-[#5A6566]">EN</span>
            <svg viewBox="0 0 16 16" width="16" height="16" class="fill-[#5A6566]">
              <path d="M8 12 2 6h12z"></path>
            </svg>
          </button>

          <div *ngIf="isLanguageOpen" class="absolute right-0 mt-2 w-44 border rounded-lg bg-white shadow-lg z-1">
            <button class="block w-full px-4 py-2 hover:bg-gray-100">
              English (US)
            </button>
            <button class="block w-full px-4 py-2 hover:bg-gray-100">
              Español (US)
            </button>
          </div>
        </div>
      </div>

      <!-- ================= MOBILE HAMBURGER (RIGHT) ================= -->
      <button class="lg:hidden p-2" (click)="toggleMobileMenu()">
        <svg class="w-6 h-6 text-[#5A6566]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>

    </div>
    <!-- ================= MOBILE SEARCH ================= -->
    <div class="flex lg:hidden flex-1 max-w-4xl  my-2">
      <div class="flex items-center bg-gray-100 rounded-md w-full h-9">

        <!-- Catalog -->
        <div class="relative">
          <button (click)="toggleCatalog()"
            class="flex items-center gap-2 px-3 h-9 border-r border-gray-300 hover:bg-gray-200">
            <span class="text-sm text-[#5A6566] font-medium">Catalog</span>
            <svg viewBox="0 0 16 16" width="16" height="16" class="fill-[#5A6566]">
              <path d="M8 12 2 6h12z"></path>
            </svg>
          </button>
          <div *ngIf="isCatalogOpen" class="absolute left-0 mt-2 w-36 rounded-md border bg-white shadow-lg z-50">
            <button class="block w-full px-4 py-2 text-left hover:bg-gray-100">
              Catalog
            </button>
            <button class="block w-full px-4 py-2 text-left hover:bg-gray-100">
              Member
            </button>
          </div>
        </div>
        <!-- Search -->
        <div class="relative flex-1">
          <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-[#7A8384]" fill="none" stroke="currentColor"
            viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>

          <input type="text" placeholder="Search for items"
            class="border-none w-full pl-10 pr-10 h-9 bg-[#EDF2F2] rounded-r-md focus:outline-none">

          <button class="absolute right-1 top-6 -translate-y-1/2" (click)="openModal()">
            <svg class="w-6 h-6 text-[#007782]" fill="none" stroke="" viewBox="0 0 24 24">
              <path fill="currentColor"
                d="M8.75 1.004a.75.75 0 0 1 0 1.5H7.07a1.25 1.25 0 0 0-1.04.557c-.255.383-.494.943-1.03.943H2.75c-.69 0-1.25.56-1.25 1.25v7c0 .69.56 1.25 1.25 1.25h10.5c.69 0 1.25-.56 1.25-1.25v-5.5a.75.75 0 0 1 1.5 0v5.5a2.75 2.75 0 0 1-2.75 2.75H2.75A2.75 2.75 0 0 1 0 12.254v-7a2.75 2.75 0 0 1 2.75-2.75h1.849l.183-.275A2.75 2.75 0 0 1 7.07 1.004zm-.749 4a3.5 3.5 0 1 1 0 7 3.5 3.5 0 0 1 0-7m0 1.5a2 2 0 1 0 0 4 2 2 0 0 0 0-4m5.012-6c.15 0 .312.088.375.263l.2.537c.187.512.587.912 1.1 1.112l.55.213a.4.4 0 0 1 0 .75l-.55.213c-.513.2-.913.6-1.1 1.112l-.2.537a.4.4 0 0 1-.388.263.4.4 0 0 1-.388-.263l-.2-.537a1.9 1.9 0 0 0-1.1-1.112l-.55-.213a.4.4 0 0 1 0-.75l.55-.213c.513-.2.913-.6 1.1-1.112l.2-.537a.43.43 0 0 1 .4-.263Z">
              </path>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</header>
<app-img-upload></app-img-upload>
<app-menu></app-menu>
